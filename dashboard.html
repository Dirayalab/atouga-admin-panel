<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>طلبات الوصول — لوحة إدارة ATOGA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: { DEFAULT: '#107275', dark: '#0B5759', light: '#2E9A9C' },
            },
          },
        },
      };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>طلبات الوصول</h1>
        <span class="user-email" id="userEmail">—</span>
      </div>
      <div class="topbar-actions">
        <button id="refreshBtn" class="btn btn-ghost" type="button">تحديث</button>
        <button id="logoutBtn" class="btn btn-danger" type="button">تسجيل الخروج</button>
      </div>
    </header>

    <main class="content">
      <section class="card create-card">
        <p class="section-title">
          <span>إنشاء حساب جديد (يوزر نيم + باسورد، بدون انتظار)</span>
        </p>
        <form id="createAccountForm" novalidate>
          <div class="create-grid">
            <div class="field">
              <label for="newUsername">اسم المستخدم (يوزر نيم) *</label>
              <input id="newUsername" class="input" type="text" autocomplete="off" placeholder="omar" required />
            </div>
            <div class="field">
              <label for="newPassword">كلمة المرور * (6 أحرف على الأقل)</label>
              <input id="newPassword" class="input" type="text" autocomplete="off" minlength="6" required />
            </div>
            <div class="field">
              <label for="newRole">الدور</label>
              <select id="newRole" class="input">
                <option value="manager">مدير (Manager)</option>
                <option value="marketer">مسوّق (Marketer)</option>
                <option value="driver">سائق (Driver)</option>
                <option value="packager">معبئ (Packager)</option>
              </select>
            </div>
            <div class="field">
              <label for="newName">الاسم الكامل (اختياري)</label>
              <input id="newName" class="input" type="text" autocomplete="off" />
            </div>
            <div class="field">
              <label for="newPhone">رقم الهاتف (اختياري)</label>
              <input id="newPhone" class="input" type="tel" autocomplete="off" />
            </div>
          </div>
          <button id="createAccountBtn" class="btn btn-primary" type="submit">إنشاء الحساب</button>
          <p class="create-hint">
            يُفعَّل الحساب فوراً ويمكن تسليمه للمستخدم مباشرة: يفتح تطبيق مانجر بـ اسم المستخدم وكلمة المرور دون أي طلب.
          </p>
        </form>
      </section>

      <p class="section-title">
        الطلبات المعلّقة
        <span id="requestsCount" class="counter">0</span>
      </p>
      <div id="requestsList"></div>
    </main>

    <script src="config.js"></script>
    <script src="app.js"></script>
    <script>
      adminPanel.initDashboard();
    </script>
  </body>
</html>
