<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>لوحة إدارة ATOGA — دخول المدير العام</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: { DEFAULT: '#107275', dark: '#0B5759', light: '#2E9A9C' },
            },
          },
        },
      };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="auth-shell">
      <section class="card">
        <div class="brand-badge">A</div>
        <div class="lang-switch" style="display:flex;gap:8px;justify-content:flex-end;margin-bottom:10px">
          <button type="button" class="btn btn-ghost btn-sm" data-lang="ar">
            <svg class="flag-icon" viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect width="450" height="600" fill="#006233"/><rect x="450" width="450" height="600" fill="#fff"/><path fill="#D21034" d="M450,150 a150,150 0 1,0 0,300 a120,150 0 1,1 0,-300 z"/><path fill="#D21034" d="M530,258 l12,37 39,0 -32,23 12,37 -31,-23 -31,23 12,-37 -32,-23 39,0 z"/></svg>
            العربية
          </button>
          <button type="button" class="btn btn-ghost btn-sm" data-lang="fr">
            <svg class="flag-icon" viewBox="0 0 3 2" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect width="1" height="2" fill="#0055A4"/><rect x="1" width="1" height="2" fill="#fff"/><rect x="2" width="1" height="2" fill="#EF4135"/></svg>
            Français
          </button>
        </div>
        <h1 data-i18n="loginTitle">لوحة إدارة ATOGA — دخول المدير العام</h1>
        <p class="subtitle" data-i18n="loginSubtitle">الدخول مقصور على المدير العام (Super Admin)</p>

        <div id="errorBox" class="error-box"></div>

        <form id="loginForm" novalidate>
          <div class="field">
            <label for="email" data-i18n="usernameLabel">اسم المستخدم (يوزر نيم)</label>
            <input
              id="email"
              class="input"
              type="email"
              inputmode="email"
              autocomplete="username"
              data-i18n="usernamePlaceholder"
              placeholder="أدخل اسم المستخدم"
              required
            />
          </div>
          <div class="field">
            <label for="password" data-i18n="passwordLabel">كلمة المرور</label>
            <input
              id="password"
              class="input"
              type="password"
              autocomplete="current-password"
              data-i18n="passwordPlaceholder"
              placeholder="••••••••"
              required
            />
          </div>
          <button id="submitBtn" class="btn btn-primary" type="submit">
            <span id="submitText" data-i18n="login">تسجيل الدخول</span>
            <span id="submitSpinner" class="spinner" style="display: none"></span>
          </button>
        </form>
      </section>
    </main>

    <script src="config.js"></script>
    <script src="i18n.js"></script>
    <script src="app.js"></script>
    <script>
      if (window.I18N) {
        window.I18N.apply();
        document.querySelectorAll('.lang-switch button').forEach(function (btn) {
          btn.addEventListener('click', function () {
            window.I18N.setLang(btn.dataset.lang);
            window.I18N.apply();
          });
        });
      }
      adminPanel.initLogin();
    </script>
  </body>
</html>
